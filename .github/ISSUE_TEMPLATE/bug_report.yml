name: Bug 报告
description: 出错了 / 行为不对 / 崩溃
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量写清复现步骤；如果涉及 token / PAIR，请先打码再贴。
  - type: dropdown
    id: target
    attributes:
      label: 运行环境
      options:
        - T4 GPU
        - TPU v5e1
        - 本机 mock / 无 Colab
        - 不确定
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机 / 系统
      placeholder: 例如 Xiaomi M2012K11AC / Android 17
  - type: input
    id: version
    attributes:
      label: App 版本
      placeholder: 例如 0.1 (1)，或 GitHub Release tag
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志 / 截图 / 服务端状态
      description: 设置页部署日志、`/anima/v1/health`、ComfyUI `comfy.log` 尾部等；请先脱敏。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue，没有重复
          required: true
        - label: 没有在内容里暴露 token / PAIR / 个人凭据
          required: true
