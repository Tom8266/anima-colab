name: 功能建议
description: 想要的新能力 / 体验改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先描述问题和场景，方案可以后面再讨论。小步改动更容易合并。
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - Android App
        - Colab 服务端 / 网关
        - 部署脚本 / notebook
        - TPU 支持
        - 文档 / 截图
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 现在的问题 / 场景
      placeholder: 我在 ... 的时候，希望 ...，现在需要 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案（可选）
      placeholder: 界面 / 接口 / 交互上可以怎么做
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue，没有重复
          required: true
        - label: 这个需求不依赖提交 token / 个人凭据
          required: true
